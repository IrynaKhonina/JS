<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Угадай Число!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <header>
    <h1>Угадай Число!</h1>
    <p class="between">(Число от 1 до 20)</p>
    <button class="btn again">Сначала!</button>
    <div class="question">?</div>
  </header>
  <main>
    <section class="left">
      <input type="number" class="number-input" placeholder="Введите число">
      <button class="btn check">Проверить!</button>
    </section>
    <section class="right">
      <p class="guess-message">Начни угадывать...</p>
      <p class="label-score">🎯 Очки: <span class="score">20</span></p>
      <p class="label-highscore">🏆 Лучший результат: <span class="highscore">0</span></p>
    </section>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
